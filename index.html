<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DZC // Army List</title>
<style>
  :root{
    --bg:#0d1012; --panel:#161a1d; --panel2:#1d2226; --line:#2a3136;
    --text:#dfe6ea; --dim:#8b9aa3;
    --amber:#e0a339; --amber-dim:#7a5b22;
    --phr:#ede19a;--phr-dim:#716b44; 
	--res:#2b6cb0;--res-dim:#153557; 
	--scourge:#5c1363; --scourge-dim:#2e0833; 
	--ucm:#446a46; --ucm-dim:#213522;
	--shaltari:#d9a441; --shaltari-dim:#7a5c20;
	--bioficer:#b0201c; --bioficer-dim:#5a0f0d;
    --bad:#e15b5b; --good:#5bc98a; --behe:#2dd4c4;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --disp: "Arial Narrow", Oswald, Impact, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; -webkit-font-smoothing:antialiased;}
  .topbar{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:14px 20px; background:linear-gradient(180deg,#14181b,#101315); border-bottom:2px solid var(--amber-dim); position:sticky; top:0; z-index:10;}
  .brand{ font-family:var(--disp); font-weight:700; letter-spacing:3px; font-size:19px; text-transform:uppercase; color:var(--amber); display:flex; align-items:center; gap:10px;}
  .brand .tag{ font-size:10px; letter-spacing:2px; color:var(--dim); font-family:var(--mono); font-weight:400;}
  .field{ display:flex; flex-direction:column; gap:3px; }
  .field label{ font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--dim); }
  select, input[type=number], input[type=text]{ background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:6px 8px; font-size:13px; font-family:var(--mono);}
  select:focus, input:focus{ outline:1px solid var(--amber); }
  .spacer{flex:1;}
  .pill-row{ display:flex; gap:8px; }
  .stat-pill{ font-family:var(--mono); font-size:12px; padding:7px 12px; border-radius:5px; background:var(--panel2); border:1px solid var(--line); text-align:center; min-width:88px;}
  .stat-pill b{ display:block; font-size:14px; font-family:var(--disp); letter-spacing:1px;}
  .stat-pill.warn{ border-color:var(--bad); color:var(--bad); }
  .stat-pill.ok{ border-color:var(--good); }

  .layout{ display:grid; grid-template-columns:1fr 400px; gap:0; min-height:calc(100vh - 64px); }
  @media (max-width:960px){ .layout{ grid-template-columns:1fr; } }

  @media (max-width:640px){
    .topbar{ padding:8px 10px; gap:6px 10px; }
    .brand{ font-size:14px; letter-spacing:2px; flex:1 1 auto; }
    .brand .tag{ display:none; }
    .field{ flex-direction:row; align-items:center; gap:6px; }
    .field label{ font-size:9px; white-space:nowrap; }
    select, input[type=number], input[type=text]{ padding:4px 6px; font-size:12px; }
    #gameSizeSelect{ max-width:150px; }
    #targetPoints{ width:64px !important; }
    .spacer{ display:none; }
    #langToggle{ padding:4px 8px !important; font-size:15px !important; }
    .pill-row{ flex-basis:100%; gap:5px; }
    .stat-pill{ padding:4px 5px; font-size:9px; min-width:0; flex:1 1 0; }
    .stat-pill b{ font-size:10px; }
    .layout{ min-height:auto; }
  }

  .catalog{ padding:16px 18px; overflow-y:auto; }
  .catalog-controls{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .catalog-controls input[type=text]{ flex:1; min-width:160px; }

  .cat-group{ margin-bottom:22px; }
  .cat-group h3{ font-family:var(--disp); text-transform:uppercase; letter-spacing:2px; font-size:13px; color:var(--dim); border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:8px; display:flex; justify-content:space-between;}
  .cat-group h3{ cursor:pointer; user-select:none; }
  .cat-group h3 .chev{ font-family:var(--mono); color:var(--amber); margin-right:6px; }
  .cat-group.collapsed .cat-group-body{ display:none; }
  .cat-group.collapsed .cat-group-body{ display:none; }

  .unit-card{ background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:8px;}
  .unit-card.phr{ border-left-color:var(--phr); background:#1c1a10; }
  .unit-card.res{ border-left-color:var(--res); background:#050b12;}
  .unit-card.ucm{ border-left-color:var(--ucm); background:#141f15; }
  .unit-card.scourge{ border-left-color:var(--scourge); background:#1c1420; }
  .unit-card.shaltari{ border-left-color:var(--shaltari); background:#1c1608; }
  .unit-card.bioficer{ border-left-color:var(--bioficer); background:#1f0f0e; }
  .unit-card.behe{ border-left-color:var(--behe); background:#0e1e1c; }
  .unit-img-wrap img{ width:96px; height:96px; object-fit:contain; border-radius:5px; border:1px solid var(--line); display:block; }
  .unit-img-placeholder{ width:96px; height:96px; border-radius:5px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10px; color:var(--dim); text-align:center; padding:4px; }
  .unit-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .unit-name{ font-weight:700; font-size:14px; }
  .unit-tags{ font-size:10px; color:var(--dim); font-family:var(--mono); }
  .unit-tags .flag{ color:var(--amber); }
  .unit-tags .flag.behe{ color:var(--behe); }
  .unit-stats{ font-family:var(--mono); font-size:11.5px; color:var(--dim); margin-top:4px; }
.weapon-table{ clear:left; margin-top:6px; border-top:1px dashed var(--line); padding-top:6px; }
.stats-table{ width:auto; border-collapse:collapse; margin-top:2px; font-family:var(--mono); font-size:11px; }
  .stats-table th, .stats-table td{ border:1px solid var(--line); padding:2px 6px; text-align:center; white-space:nowrap; }
  .stats-table th{ background:var(--panel2); color:var(--dim); font-weight:700; }
  .weapon-row{ font-family:var(--mono); font-size:10.5px; color:#b7c2c8; padding:1px 0; display:grid; grid-template-columns: 1.4fr 0.5fr 0.55fr 0.7fr 0.35fr 0.35fr 0.35fr 1.6fr; gap:4px; }
  .weapon-row.hdr{ color:var(--dim); font-weight:700; border-bottom:1px solid var(--line); padding-bottom:2px; margin-bottom:2px;}
  .gear-line{ font-family:var(--mono); font-size:10.5px; color:var(--behe); margin-top:5px; }
  .unit-controls{ display:flex; gap:8px; margin-top:8px; align-items:flex-end; flex-wrap:wrap; }
  .unit-controls .field{ min-width:90px; }
  button{ font-family:inherit; cursor:pointer; border-radius:4px; border:1px solid var(--line); background:var(--panel2); color:var(--text); padding:6px 12px; font-size:12px;}
  button:hover{ border-color:var(--amber); color:var(--amber); }
  .btn-add{ background:var(--amber-dim); border-color:var(--amber); color:#1a1400; font-weight:700; }
  .btn-add:hover{ background:var(--amber); color:#1a1400; }
  .btn-danger{ border-color:var(--bad); color:var(--bad); background:transparent; }
  .btn-danger:hover{ background:var(--bad); color:#1a0000; }
  .btn-primary{ background:var(--good); border-color:var(--good); color:#06210f; font-weight:700;}
  .btn-primary:hover{ filter:brightness(1.1); color:#06210f; }
  .btn-ghost{ background:transparent; }

  .roster{ background:var(--panel); border-left:2px solid var(--line); padding:16px 18px; overflow-y:auto; }
  .roster h2{ font-family:var(--disp); text-transform:uppercase; letter-spacing:2px; font-size:15px; margin:0 0 12px; }
  .summary-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:16px; }
  .roster-empty{ color:var(--dim); font-size:13px; font-style:italic; padding:20px 0; text-align:center; border:1px dashed var(--line); border-radius:6px;}

  .roster-entry{ background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:7px;}
  .roster-entry.behe{ border-color:var(--behe); }
  .re-top{ display:flex; justify-content:space-between; gap:8px; font-size:13px;}
  .re-top .n{ font-weight:700; }
  .re-top .p{ font-family:var(--mono); color:var(--amber); }
  .re-sub{ font-size:11px; color:var(--dim); margin-top:2px; font-family:var(--mono); display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .re-sub input[type=number]{ width:52px; padding:2px 4px; font-size:11px;}
  .re-sub .grp-input{ width:38px; }
  .re-remove{ font-size:11px; color:var(--bad); background:none; border:none; cursor:pointer; padding:0 4px;}
  .re-remove:hover{ text-decoration:underline; }

  .collapse-section{ margin-bottom:16px; }
  .collapse-toggle{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:9px 12px; font-family:var(--disp); text-transform:uppercase; letter-spacing:1.5px; font-size:13px; color:var(--text); }
  .collapse-toggle:hover{ border-color:var(--amber); color:var(--amber); }
  .collapse-toggle .chev{ font-family:var(--mono); color:var(--amber); width:10px; flex:none; }
  .collapse-toggle .sec-badge{ margin-left:auto; font-family:var(--mono); font-size:11px; letter-spacing:0; text-transform:none; }
  .collapse-toggle .sec-badge.ok{ color:var(--good); }
  .collapse-toggle .sec-badge.warn{ color:var(--bad); }
  .collapse-body{ padding-top:10px; }
  .collapse-body.hidden{ display:none; }

  .warnbox{ margin-top:14px; }
  .warn-item{ font-size:11.5px; padding:7px 9px; border-radius:5px; margin-bottom:6px; font-family:var(--mono);}
  .warn-item.bad{ background:#2a1414; border:1px solid var(--bad); color:#ff9d9d; }
  .warn-item.good{ background:#12241a; border:1px solid var(--good); color:#a8f0c6; }

  .group-block{ background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:7px 10px; margin-bottom:8px; }
  .group-block.ok{ border-left:3px solid var(--good); }
  .group-block.bad{ border-left:3px solid var(--bad); }
  .group-block h4{ margin:0 0 4px; font-family:var(--disp); letter-spacing:1px; font-size:12px; color:var(--amber); display:flex; justify-content:space-between; }
  .group-block .gb-member{ font-size:11px; font-family:var(--mono); color:var(--dim); padding:1px 0; }
  .group-block .gb-member.transport{ color:var(--phr); }
  .group-block .gb-load{ font-size:10.5px; font-family:var(--mono); margin-top:4px; display:flex; gap:14px; }
  .group-block .gb-load span.over{ color:var(--bad); font-weight:700; }
  .group-block .gb-load span.equal{ color:var(--good); font-weight:700; }

  .cat-breakdown{ margin-top:12px; font-size:11.5px; }
  .cat-breakdown div{ display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid var(--line); font-family:var(--mono);}
  .cat-breakdown .over{ color:var(--bad); }
  .cat-breakdown .equal{ color:var(--good); }

  .export-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .export-row button{ flex:1 1 45%; padding:10px; font-size:11px; text-transform:uppercase; letter-spacing:1px;}

  .footnote{ font-size:10.5px; color:var(--dim); margin-top:16px; line-height:1.5; border-top:1px solid var(--line); padding-top:10px;}

  details.glossary{ margin-top:16px; border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  details.glossary summary{ cursor:pointer; font-family:var(--disp); letter-spacing:1px; text-transform:uppercase; font-size:12px; color:var(--amber);}
  .gloss-grid{ margin-top:8px; display:grid; grid-template-columns:1fr; gap:4px; max-height:260px; overflow-y:auto;}
  .gloss-item{ font-size:11px; font-family:var(--mono); color:var(--dim); border-bottom:1px dotted var(--line); padding:3px 0;}
  .gloss-item b{ color:var(--text); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">⛛ DZC ROSTER <span class="tag" data-i18n="brand.tag">V3.02 / last update : 26/08/2026</span></div>

  <div class="field"><label data-i18n="label.faction">Faction</label>
<select id="factionSelect"><option value="PHR">PHR</option><option value="Resistance">Resistance</option><option value="UCM">UCM</option><option value="Scourge">Scourge</option><option value="Shaltari">Shaltari</option><option value="Bioficer">Bioficer</option></select>
  </div>

  <div class="field"><label data-i18n="label.gameSize">Taille de partie</label>
    <select id="gameSizeSelect">
      <option value="Skirmish">Skirmish (501-1000)</option>
      <option value="Clash" selected>Clash (1001-2000)</option>
      <option value="Battle">Battle (2001-3000)</option>
      <option value="Reconquest">Reconquest (3001+)</option>
    </select>
  </div>

  <div class="field"><label data-i18n="label.targetPoints">Points visés</label>
    <input type="number" id="targetPoints" value="1750" step="5" style="width:90px;">
  </div>

  <div class="spacer"></div>
  <button id="langToggle" class="btn-ghost" type="button" title="Français / English" style="padding:6px 10px; font-size:17px; line-height:1; border-color:var(--amber); color:var(--amber);">🇫🇷</button>
  <div class="pill-row">
    <div class="stat-pill" id="pillPoints">0 / 0<b>PTS</b></div>
    <div class="stat-pill" id="pillGroups">0 / 0<b>GROUPES</b></div>
    <div class="stat-pill" id="pillStatus">—<b>STATUT</b></div>
  </div>
</div>

<div class="layout">
  <div class="catalog">
    <div class="catalog-controls">
      <input type="text" id="searchBox" placeholder="Rechercher une unité..." data-i18n-placeholder="placeholder.search">
      <select id="catFilter">
        <option value="" data-i18n="opt.allCategories">Toutes catégories</option>
        <option>Standard</option><option>Vanguard</option><option>Heavy</option>
        <option>Support</option><option>Transport</option><option>Behemoth</option>
      </select>
    </div>
    <div id="catalogList"></div>
  </div>

  <div class="roster">
    <h2 data-i18n="h2.rosterSheet">Feuille de Roster</h2>

    <div class="collapse-section" id="secStatus">
      <button class="collapse-toggle" type="button" data-target="statusBody" aria-expanded="true">
        <span class="chev">▾</span>
        <span data-i18n="section.status">Statut de la partie</span>
        <span class="sec-badge" id="statusBadge"></span>
      </button>
      <div class="collapse-body" id="statusBody">
        <div class="summary-grid" id="summaryGrid"></div>
        <div class="cat-breakdown" id="catBreakdown"></div>
        <div class="warnbox" id="warnBox"></div>
      </div>
    </div>

    <div class="export-row">
      <button class="btn-primary" id="exportCsv" data-i18n="btn.exportCsv">⇩ Exporter en CSV</button>
      <button class="btn-primary" id="exportPdf" style="background:var(--behe); border-color:var(--behe);" data-i18n="btn.exportPdf">⇩ Exporter en PDF</button>
      <button class="btn-primary" id="exportJson" data-i18n="btn.exportJson">⇩ Exporter la liste (JSON)</button>
      <button class="btn-ghost" id="importJsonBtn" style="border-color:var(--amber); color:var(--amber);" data-i18n="btn.importJson">⇧ Importer une liste (JSON)</button>
      <input type="file" id="importJsonFile" accept="application/json" style="display:none;">
      <button class="btn-danger" id="resetBtn" data-i18n="btn.reset">Vider le roster</button>
    </div>

<div class="collapse-section" id="secTransport">
  <button class="collapse-toggle" type="button" data-target="transportBody" aria-expanded="true">
    <span class="chev">▾</span>
    <span data-i18n="section.transport">Transport</span>
    <span class="sec-badge" id="transportBadge"></span>
  </button>
  <div class="collapse-body" id="transportBody">
    <div id="groupSummary"></div>
  </div>

    <div class="collapse-section" id="secUnits">
      <button class="collapse-toggle" type="button" data-target="unitsBody" aria-expanded="true">
        <span class="chev">▾</span>
        <span data-i18n="section.units">Unités du roster</span>
        <span class="sec-badge" id="unitsBadge"></span>
      </button>
      <div class="collapse-body" id="unitsBody">
        <div id="rosterList"></div>
      </div>
    </div>

    <details class="glossary">
      <summary data-i18n="glossary.summary">Glossaire des règles spéciales (armes / unités / Behemoths)</summary>
      <div class="gloss-grid" id="glossGrid"></div>
    </details>

    <div class="footnote" id="footnoteText"></div>
  </div>
</div>

<script>
/* ---------------- WEAPON HELPER ---------------- */
function W(n,arc,ma,r,att,ac,e,sp){ return {n,arc,ma,r,att,ac,e,sp}; }
function weaponLine(w){
  return `${w.n} — ${w.arc} / MA ${w.ma} / R ${w.r} / Att ${w.att} / Ac ${w.ac} / E ${w.e}${w.sp && w.sp!=='-' ? ' / ['+w.sp+']' : ''}`;
}

function weaponMatchesVariant(weaponName, variantName){
  const m = weaponName.match(/\(([^)]+)\)\s*$/);
  if(!m) return true; // pas de parenthèse = arme générique, toujours affichée
  const inside = m[1];
  //if (inside === 'All') return true; 
  return inside.split(/[,/]/).map(s=>s.trim())
    .some(part => part.toLowerCase() === variantName.toLowerCase() || variantName.toLowerCase().includes(part.toLowerCase()));
}

function filterSpecialByVariant(specialStr, variantName){
  if(!specialStr || specialStr==='-' || specialStr==='—') return specialStr;
  const parts = specialStr.split(',').map(s=>s.trim()).filter(Boolean);
  const kept = parts.filter(p => weaponMatchesVariant(p, variantName));
  return kept.length ? kept.join(', ') : '—';
}

// Vérifie si une règle spéciale nommée (ex: 'Cling') est présente dans la chaîne "special"
// d'une unité (liste séparée par des virgules, ex: 'Cling, Ev1, UC'). Comparaison insensible
// à la casse et tolérante aux valeurs numériques accolées (ex: 'Ev1' ne matche pas 'Cling').
function hasSpecialRule(specialStr, ruleName){
  if(!specialStr || specialStr==='-' || specialStr==='—') return false;
  return specialStr.split(',').map(s=>s.trim().toLowerCase())
    .some(p => p === ruleName.toLowerCase());
}

function parseStats(u){
  const s = u.stats;
  const mA = s.match(/A(\d+)/);
  const mOF = s.match(/OF(\d+)/);
  const mDF = s.match(/DF([A-Za-z0-9+]+)/);
  const mB = s.match(/B\(?([A-Za-z0-9+]+)\)?/);
  const mDP = s.match(/DP\s*([\d/]+)/);
  return {
    mv: u.mv,
    a:  mA  ? mA[1]  : '-',
    of: mOF ? mOF[1] : '-',
    df: mDF ? mDF[1] : '-',
    b:  mB  ? mB[1]  : '-',
    dp: mDP ? mDP[1] : '-'
  };
}

function statsTableHtmlWeb(u){
  const p = parseStats(u);
  return `<table class="stats-table">
    <tr><th>Mv</th><th>A</th><th>OF</th><th>DF</th><th>B</th><th>DP</th></tr>
    <tr><td>${p.mv}</td><td>${p.a}</td><td>${p.of}</td><td>${p.df}</td><td>${p.b}</td><td>${p.dp}</td></tr>
  </table>`;
}

function weaponTableHtml(u, variantName){
  const filtered = u.weapons.filter(w => !isOptionalWeapon(w) && weaponMatchesVariant(w.n, variantName));
  if(filtered.length===0) return `<div class="unit-stats" style="font-style:italic;">${t('text.noWeapons')}</div>`;
  return `<div class="weapon-table">
    <div class="weapon-row hdr"><span>${t('weapon.hdr.name')}</span><span>${t('weapon.hdr.arc')}</span><span>${t('weapon.hdr.ma')}</span><span>${t('weapon.hdr.r')}</span><span>${t('weapon.hdr.att')}</span><span>${t('weapon.hdr.ac')}</span><span>${t('weapon.hdr.e')}</span><span>${t('weapon.hdr.special')}</span></div>
    ${filtered.map(w=>`<div class="weapon-row"><span>${w.n}</span><span>${w.arc}</span><span>${w.ma}</span><span>${w.r}</span><span>${w.att}</span><span>${w.ac}</span><span>${w.e}</span><span>${w.sp}</span></div>`).join('')}
  </div>`;
}

function parseOptionalCost(weaponName){
  const m = weaponName.match(/\(\+\s*(\d+)\s*pts\*?\)/i);
  return m ? parseInt(m[1],10) : null;
}
function isOptionalWeapon(w){ return parseOptionalCost(w.n) !== null; }
function optionalWeaponsOf(u){ return u.weapons.filter(isOptionalWeapon); }



/* ---------------- GLOSSARY ---------------- */
const GLOSSARY = [
["Ac","Précision (jet requis pour toucher, avant modificateurs)."],
["Att","Nombre d'attaques (tirs) de l'arme."],
["E","Énergie de l'arme, comparée à l'Armure (A) de la cible via la table de dégâts."],
["MA (Move & Attack)","Distance max. que l'unité peut parcourir tout en utilisant cette arme dans la même activation."],
["R","Portée. Deux valeurs séparées par / : la 2e s'applique contre Véhicules/Aéronefs (contre-mesures actives)."],
["A / DF","Armure (Véhicules/Aéronefs) ou Défense (Infanterie) — sert à bloquer les dégâts."],
["OF","Offense — pool de dés en combat rapproché (CQB) pour l'Infanterie."],
["B (Bravery)","Bravoure — seuil de test moral ; 'A' = réussite automatique."],
["DP","Points de Dégâts (vie) de l'unité."],
["Ev X","Contre-mesures d'Évasion : les attaquants subissent -X Ac contre cette unité."],
["P X+ / Passive CM","Contre-mesures passives : sauvegarde sur X+ contre les dégâts (pénalisée à E9, ignorée à E10+)."],

function t(key, vars){
  let str = (I18N[LANG] && I18N[LANG][key] !== undefined) ? I18N[LANG][key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
  if(vars){
    Object.keys(vars).forEach(k=>{ str = str.split('{'+k+'}').join(vars[k]); });
  }
  return str;
}

function applyStaticI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
  const fn = document.getElementById('footnoteText');
  if(fn) fn.innerHTML = t('footnote.text');
  const langBtn = document.getElementById('langToggle');
  if(langBtn) langBtn.textContent = LANG==='fr' ? '🇫🇷' : '🇬🇧';
}

/* ---------------- TRANSPORT: Requirement / Capacity par type (V3, à remplir toi-même) ----------------
   reqInf / reqVeh = place prise PAR UNE unité (de ce type) quand elle embarque (0 = n'a pas ce besoin)
   capInf / capVeh = place OFFERTE PAR UNE unité si elle sert de transport pour ce type (0 = n'offre pas cette capacité)
   Règle V3 : requirement <= capacity du transporteur, SÉPARÉMENT pour Infanterie et Véhicule
   (un transport à capacité Véhicule ne peut pas embarquer de l'Infanterie et inversement).
   Une unité peut cumuler requirement ET capacity (ex: IFV qui transporte de l'infanterie tout en
   étant lui-même transportable par un plus gros Dropship).
   Ces valeurs sont multipliées par la taille d'escouade de l'entrée dans le roster.
------------------------------------------------------------- */

let roster = [];

let nextGroup = 1;

const $ = sel => document.querySelector(sel);
const factionSelect = $('#factionSelect');
const gameSizeSelect = $('#gameSizeSelect');
const targetPointsInput = $('#targetPoints');
const searchBox = $('#searchBox');
const catFilter = $('#catFilter');

function fmt(n){ return n.toLocaleString(LANG==='en' ? 'en-US' : 'fr-FR'); }
function currentGameSizeCfg(){ return GAME_SIZES[gameSizeSelect.value]; }

/* group "weight" toward Groups-cap: Behemoth uses its Group Equivalent, others 1 */
function groupWeight(groupId){
  const entries = roster.filter(r=>r.groupId===groupId);
  let weight = 1;
  entries.forEach(e=>{
    const u = UNITS.find(uu=>uu.id===e.unitId);
    if(u.isBehemoth) weight = Math.max(weight, u.groupEquivalent||1);
  });
  return weight;
}
function isShaltariGate(unit){
  // Shaltari Gates: category 'Transport' units of the Shaltari faction (Eden, Gaia, Haven, Spirit, Zion...).
  // Per the official Shaltari Stat Cards: "Gates do not count against your number of allowed Groups."
  return unit.faction==='Shaltari' && unit.category==='Transport';
}
function isGateOnlyGroup(groupId){
  const entries = roster.filter(r=>r.groupId===groupId);
  if(entries.length===0) return false;
  return entries.every(e=>{
    const u = UNITS.find(uu=>uu.id===e.unitId);
    return u && isShaltariGate(u);
  });
}
function reservedGroupsCount(){
  const groups = new Set(roster.map(r=>r.groupId));
  let total=0;
  groups.forEach(g=>{ if(!isGateOnlyGroup(g)) total+=groupWeight(g); });
  return total;
}

function unitTotalPts(entry){
  const unit = UNITS.find(u=>u.id===entry.unitId);
  const variant = unit.variants[entry.variantIdx];
  const qty = entry.squadSize || 1;
  const extrasCost = (entry.extras||[]).reduce((s,name)=>{
    const w = unit.weapons.find(ww=>ww.n===name);
    return s + (w ? (parseOptionalCost(w.n)||0) : 0);
  }, 0);
  return (variant.pts + extrasCost) * qty;
}
function groupPointsMap(){
  const map = {};
  roster.forEach(r=>{ map[r.groupId] = (map[r.groupId]||0) + unitTotalPts(r); });
  return map;
}
function categoryPointsMap(){
  const map = {Standard:0, Vanguard:0, Heavy:0, Support:0, Transport:0, Generated:0};
  roster.forEach(r=>{ const unit = UNITS.find(u=>u.id===r.unitId); map[unit.category] += unitTotalPts(r); });
  return map;
}
function totalPoints(){ return roster.reduce((s,r)=>s+unitTotalPts(r),0); }

/* Transport load per group, séparé Infanterie / Véhicule : reqX doit être <= capX */
function transportLoadMap(){
  const map = {};

  const CAP_KEYS = [
    {key:'inf',      reqField:'reqInf',      capField:'capInf'},
    {key:'vehLourd',  reqField:'reqVehLourd', capField:'capVehLourd'},
    {key:'veh',       reqField:'reqVeh',      capField:'capVeh'},
    {key:'vehLeg',    reqField:'reqVehLeg',   capField:'capVehLeg'},
    {key:'spe',       reqField:'reqSpe',      capField:'capSpe'},
    {key:'spe2',      reqField:'reqSpe2',     capField:'capSpe2'}
  ];

  // 1er passage : cumul des BESOINS (reqX) de chaque groupe — gère reqEither et capExclusive
  roster.forEach(r=>{
    const unit = UNITS.find(uu=>uu.id===r.unitId);
    if(!map[r.groupId]) map[r.groupId] = {reqInf:0, reqVehLourd:0, reqVeh:0, reqVehLeg:0, reqSpe:0, reqSpe2:0, capInf:0, capVehLourd:0, capVeh:0, capVehLeg:0, capSpe:0, capSpe2:0};

    // Shaltari exception (official Stat Cards, 'Gate' rule): Gates are always taken with NO
    // units aboard at list-building time — Squads Embark/Disembark from ANY compatible Gate
    // in-game via Holding, so there is no per-Group req<=cap pairing to validate for them.
    if(unit && unit.faction==='Shaltari' && !isShaltariGate(unit)) return;

    // Cling exception (Scourge special rule): a Squad with Cling may be Embarked aboard ANY
    // Aircraft without Cling (Transport or not) that has at least as much DP — Transport
    // Symbols are ignored. So a Cling Squad never needs its own req<=cap pairing validated.
    if(unit && hasSpecialRule(unit.special, 'Cling')) return;

    const td = TRANSPORT_DATA[r.unitId] || {reqInf:0, reqVehLourd:0, reqVeh:0, reqVehLeg:0, reqSpe:0, reqSpe2:0, capInf:0, capVehLourd:0, capVeh:0, capVehLeg:0, capSpe:0, capSpe2:0, reqEither:false, capEither:false, capExclusive:false};

    if(td.capExclusive){
      // le mode CHOISI est auto-couvert par sa propre capacité (l'unité s'embarque elle-même dans ce mode-là) ;
      // tout autre poids (ex: l'autre catégorie) reste à charge d'un transporteur externe
      const availableTypes = CAP_KEYS.filter(t => (td[t.capField]||0) > 0);
      const mode = (r.capMode && availableTypes.some(t=>t.key===r.capMode)) ? r.capMode : (availableTypes[0] && availableTypes[0].key);

      CAP_KEYS.forEach(t=>{
        if(t.key === mode) return; // auto-couvert, on ne compte pas ce besoin
        map[r.groupId][t.reqField] += (td[t.reqField]||0) * r.squadSize;
      });
      return;
    }

    if(td.reqEither){
      if(r.transportMode==='vehLourd') map[r.groupId].reqVehLourd += (td.reqVehLourd||0) * r.squadSize;
      else if(r.transportMode==='veh') map[r.groupId].reqVeh += (td.reqVeh||0) * r.squadSize;
      else if(r.transportMode==='vehLeg') map[r.groupId].reqVehLeg += (td.reqVehLeg||0) * r.squadSize;
      else if(r.transportMode==='spe') map[r.groupId].reqSpe += (td.reqSpe||0) * r.squadSize;
      else if(r.transportMode==='spe2') map[r.groupId].reqSpe2 += (td.reqSpe2||0) * r.squadSize;
      else map[r.groupId].reqInf += (td.reqInf||0) * r.squadSize;
    } else {
      map[r.groupId].reqInf += (td.reqInf||0) * r.squadSize;
      map[r.groupId].reqVehLourd += (td.reqVehLourd||0) * r.squadSize;
      map[r.groupId].reqVeh += (td.reqVeh||0) * r.squadSize;
      map[r.groupId].reqVehLeg += (td.reqVehLeg||0) * r.squadSize;
      map[r.groupId].reqSpe += (td.reqSpe||0) * r.squadSize;
      map[r.groupId].reqSpe2 += (td.reqSpe2||0) * r.squadSize;
    }
  });

  // 2e passage : cumul des CAPACITÉS (capX), en résolvant capEither / capExclusive
  roster.forEach(r=>{
    const td = TRANSPORT_DATA[r.unitId] || {reqInf:0, reqVehLourd:0, reqVeh:0, reqVehLeg:0, reqSpe:0, reqSpe2:0, capInf:0, capVehLourd:0, capVeh:0, capVehLeg:0, capSpe:0, capSpe2:0, reqEither:false, capEither:false, capExclusive:false};
    const g = map[r.groupId];

    if(td.capExclusive){
      const availableTypes = CAP_KEYS.filter(t => (td[t.capField]||0) > 0);
      const mode = (r.capMode && availableTypes.some(t=>t.key===r.capMode)) ? r.capMode : (availableTypes[0] && availableTypes[0].key);
      const chosen = CAP_KEYS.find(t=>t.key===mode);
      if(chosen) g[chosen.capField] += (td[chosen.capField]||0) * r.squadSize;
    } else if(td.capEither){
      g.capInf += (td.capInf||0) * r.squadSize;
      const wantsLourd = (g.reqVehLourd||0) > 0;
      const wantsVeh = (g.reqVeh||0) > 0;
      if(wantsLourd && !wantsVeh){
        g.capVehLourd += (td.capVehLourd||0) * r.squadSize;
      } else if(wantsVeh && !wantsLourd){
        g.capVeh += (td.capVeh||0) * r.squadSize;
      } else {
        g.capVehLourd += (td.capVehLourd||0) * r.squadSize;
      }
    } else {
      g.capInf += (td.capInf||0) * r.squadSize;
      g.capVehLourd += (td.capVehLourd||0) * r.squadSize;
      g.capVeh += (td.capVeh||0) * r.squadSize;
      g.capVehLeg += (td.capVehLeg||0) * r.squadSize;
      g.capSpe += (td.capSpe||0) * r.squadSize;
      g.capSpe2 += (td.capSpe2||0) * r.squadSize;
    }
  });

  return map;
}

/* ---------------- RENDER CATALOG ---------------- */
const collapsedCats = new Set(); // catégories repliées, persiste entre les re-renders

function buildCatGroup(list, label, items){
  const collapsed = collapsedCats.has(label);
  const wrap = document.createElement('div');
  wrap.className = 'cat-group' + (collapsed ? ' collapsed' : '');

  const h3 = document.createElement('h3');
  h3.innerHTML = `<span><span class="chev">${collapsed?'▸':'▾'}</span>${label}</span><span>${items.length}</span>`;
  h3.addEventListener('click', ()=>{
    collapsedCats.has(label) ? collapsedCats.delete(label) : collapsedCats.add(label);
    renderCatalog();
  });
  wrap.appendChild(h3);

  const body = document.createElement('div');
  body.className = 'cat-group-body';
  items.forEach(u=>body.appendChild(renderUnitCard(u)));
  wrap.appendChild(body);

  list.appendChild(wrap);
}

function renderCatalog(){
  const faction = factionSelect.value;
  const search = searchBox.value.trim().toLowerCase();
  const catFilterVal = catFilter.value;
  const list = $('#catalogList');
  list.innerHTML='';

  if(catFilterVal==='Behemoth'){
    const items = UNITS.filter(u=>u.faction===faction && u.isBehemoth && (!search || u.name.toLowerCase().includes(search)));
    buildCatGroup(list, 'Behemoths', items);
    return;
  }

  const cats = ['Standard','Vanguard','Heavy','Support','Transport','Generated'];
  cats.forEach(cat=>{
    if(catFilterVal && catFilterVal!==cat) return;
    const items = UNITS.filter(u=>u.faction===faction && u.category===cat && (!search || u.name.toLowerCase().includes(search)));
    if(items.length===0) return;
    buildCatGroup(list, cat, items);
  });
}

function renderUnitCard(u){
  const el = document.createElement('div');
el.className = 'unit-card ' + (u.isBehemoth ? 'behe' : (u.faction==='PHR'?'phr':(u.faction==='Scourge'?'scourge':(u.faction==='UCM'?'ucm':(u.faction==='Shaltari'?'shaltari':(u.faction==='Bioficer'?'bioficer':'res'))))));
  const flags = [];
  if(u.rare) flags.push('<span class="flag">[RARE]</span>');
  if(u.unique) flags.push('<span class="flag">[UNIQUE]</span>');
  if(u.isBehemoth) flags.push(`<span class="flag behe">[BEHEMOTH · Power ${u.power} · Grp.Eq ${u.groupEquivalent}]</span>`);
  const squadTxt = u.squadMin===null ? t('text.freeQty') : `${u.squadMin}-${u.squadMax} ${t('text.perSquad')}`;

  const weaponsHtml = `<div class="weapon-table-slot">${weaponTableHtml(u, u.variants[0].name)}</div>`;

	
  const optWeapons = optionalWeaponsOf(u);
  const optHtml = optWeapons.length ? `
    <div class="field" style="min-width:220px;">
      <label>${t('label.optWeapons')}</label>
      ${optWeapons.map(w=>`<label style="display:block; font-size:11px; font-weight:400; color:var(--text);">
        <input type="checkbox" class="ctl-opt" value="${w.n}"> ${w.n} — +${parseOptionalCost(w.n)}pts
      </label>`).join('')}
    </div>` : '';
	
  const gearHtml = u.gear ? `<div class="gear-line">Gear: ${u.gear.join(' · ')}</div>` : '';
  const noteHtml = u.note ? `<div class="unit-stats" style="color:var(--amber);">${u.note}</div>` : '';
  const imgPath = UNIT_IMAGES[u.id];
  const imgHtml = imgPath
    ? `<div class="unit-img-wrap"><img src="${imgPath}" alt="${u.name}" onerror="this.parentElement.innerHTML='<div class=&quot;unit-img-placeholder&quot;>${t('text.imageNotFound')}</div>'"></div>`
    : `<div class="unit-img-wrap"><div class="unit-img-placeholder">${u.type.split(' ')[0]}</div></div>`;

  el.innerHTML = `
    ${imgHtml}
    <div class="unit-head">
      <div class="unit-name">${u.name}</div>
      <div class="unit-tags">${u.type} ${flags.join(' ')}</div>
    </div>
<div class="unit-stats">${squadTxt}</div>
    ${statsTableHtmlWeb(u)}
   <div class="unit-stats special-slot">${filterSpecialByVariant(u.special, u.variants[0].name)}</div>
    ${weaponsHtml}
    ${gearHtml}
    ${noteHtml}
    <div class="unit-controls">
      <div class="field"><label>${t('label.loadout')}</label>
        <select class="ctl-variant">${u.variants.map((v,i)=>`<option value="${i}">${v.name} — ${v.pts}pts</option>`).join('')}</select>
      </div>
      <div class="field"><label>${u.squadMin===null?t('label.number'):t('label.squadSize')}</label>
        <input type="number" class="ctl-size" min="${u.squadMin===null?1:u.squadMin}" max="${u.squadMin===null?20:u.squadMax}" value="${u.squadMin===null?1:u.squadMin}" style="width:60px;">
      </div>
	  ${optHtml}
      <button class="btn-add">${t('btn.add')}</button>
    </div>
  `;
el.querySelector('.btn-add').addEventListener('click', ()=>{
    const variantIdx = parseInt(el.querySelector('.ctl-variant').value,10);
    let squadSize = parseInt(el.querySelector('.ctl-size').value,10);
    if(isNaN(squadSize) || squadSize<1) squadSize=1;
    const extras = Array.from(el.querySelectorAll('.ctl-opt:checked')).map(c=>c.value);
    const td0 = TRANSPORT_DATA[u.id];
    roster.push({rid: nextRid++, unitId:u.id, variantIdx, squadSize, groupId: nextGroup++, extras, transportMode: (td0 && td0.reqEither) ? 'inf' : null, capMode: null});
    renderAll();
  });
  
  el.querySelector('.ctl-variant').addEventListener('change', (e)=>{
    const variantName = u.variants[parseInt(e.target.value,10)].name;
    el.querySelector('.weapon-table-slot').innerHTML = weaponTableHtml(u, variantName);
    el.querySelector('.special-slot').textContent = filterSpecialByVariant(u.special, variantName);
  });
  
  return el;
}

/* ---------------- RENDER ROSTER ---------------- */
function renderRoster(){
  const list = $('#rosterList');
  list.innerHTML='';
  if(roster.length===0){
    list.innerHTML = `<div class="roster-empty">${t('roster.empty')}</div>`;
    return;
  }
  roster.forEach(entry=>{
const unit = UNITS.find(u=>u.id===entry.unitId);
    const variant = unit.variants[entry.variantIdx];
    const pts = unitTotalPts(entry);
    const optWeapons = optionalWeaponsOf(unit);
    const optHtml = optWeapons.length ? `
      <div style="margin-top:4px;">
        ${optWeapons.map(w=>{
          const cost = parseOptionalCost(w.n);
          const checked = (entry.extras||[]).includes(w.n);
          return `<label style="display:block; font-size:10.5px; color:var(--dim);"><input type="checkbox" class="e-opt" value="${w.n}" ${checked?'checked':''}> ${w.n} (+${cost}pts)</label>`;
        }).join('')}
      </div>` : '';
    const el = document.createElement('div');
    el.className='roster-entry' + (unit.isBehemoth ? ' behe':'');
    el.innerHTML = `
      <div class="re-top">
        <span class="n">${unit.name} <span style="color:var(--dim); font-weight:400;">(${variant.name})</span>${unit.isBehemoth?' <span style="color:var(--behe);">⚙</span>':''}</span>
        <span class="p">${fmt(pts)} pts</span>
      </div>
      <div class="re-sub">
        <span>×</span><input type="number" class="e-size" min="1" value="${entry.squadSize}">
        <span>${t('text.group')}</span><input type="number" class="e-group grp-input" min="1" value="${entry.groupId}">
        ${unit.isBehemoth ? `<span title="Group Equivalent">GrpEq ${unit.groupEquivalent}</span>` : ''}
        <button class="re-remove">${t('btn.remove')}</button>
      </div>
      ${optHtml}
    `;
    el.querySelector('.e-size').addEventListener('change', e=>{ let v=parseInt(e.target.value,10); if(isNaN(v)||v<1)v=1; entry.squadSize=v; renderAll(); });
    el.querySelector('.e-group').addEventListener('change', e=>{ let v=parseInt(e.target.value,10); if(isNaN(v)||v<1)v=1; entry.groupId=v; renderAll(); });
    el.querySelector('.re-remove').addEventListener('click', ()=>{ roster = roster.filter(r=>r.rid!==entry.rid); renderAll(); });
    el.querySelectorAll('.e-opt').forEach(chk=>{
      chk.addEventListener('change', ()=>{
        entry.extras = entry.extras || [];
        if(chk.checked){ if(!entry.extras.includes(chk.value)) entry.extras.push(chk.value); }
        else { entry.extras = entry.extras.filter(n=>n!==chk.value); }
        renderAll();
      });
    });
    const td = TRANSPORT_DATA[entry.unitId];
    if(td && td.reqEither){
      const TRANSPORT_TYPES = [
        {key:'inf',      req:'reqInf',      label:t('transport.infantry')},
        {key:'vehLourd', req:'reqVehLourd', label:t('transport.vehHeavy')},
        {key:'veh',      req:'reqVeh',      label:t('transport.veh')},
        {key:'vehLeg',   req:'reqVehLeg',   label:t('transport.vehLight')},
        {key:'spe',      req:'reqSpe',      label:t('transport.special')},
        {key:'spe2',     req:'reqSpe2',     label:t('transport.special2')}
      ];
      const availableTypes = TRANSPORT_TYPES.filter(t => (td[t.req]||0) > 0);

      if(availableTypes.length > 0){
        // si le mode actuellement stocké n'est plus valide (ou vide), on prend le premier disponible par défaut
        if(!entry.transportMode || !availableTypes.some(t=>t.key===entry.transportMode)){
          entry.transportMode = availableTypes[0].key;
        }
        const modeSel = document.createElement('select');
        modeSel.style.cssText = 'width:auto; font-size:10px; margin-left:6px;';
        modeSel.innerHTML = availableTypes.map(t =>
          `<option value="${t.key}" ${entry.transportMode===t.key?'selected':''}>${t.label}</option>`
        ).join('');
        modeSel.addEventListener('change', e=>{ entry.transportMode = e.target.value; renderAll(); });
        el.querySelector('.re-sub').appendChild(modeSel);
      }
    }
	if(td && td.capExclusive){
      const CAP_TYPES = [
        {key:'inf',      field:'capInf',      label:t('transport.infantry')},
        {key:'vehLourd', field:'capVehLourd', label:t('transport.vehHeavy')},
        {key:'veh',      field:'capVeh',      label:t('transport.veh')},
        {key:'vehLeg',   field:'capVehLeg',   label:t('transport.vehLight')},
        {key:'spe',      field:'capSpe',      label:t('transport.special')},
        {key:'spe2',     field:'capSpe2',     label:t('transport.special2')}
      ];
      const availableCapTypes = CAP_TYPES.filter(t => (td[t.field]||0) > 0);

      if(availableCapTypes.length > 0){
        if(!entry.capMode || !availableCapTypes.some(t=>t.key===entry.capMode)){
          entry.capMode = availableCapTypes[0].key;
        }
        const capSel = document.createElement('select');
        capSel.style.cssText = 'width:auto; font-size:10px; margin-left:6px;';
        capSel.innerHTML = availableCapTypes.map(t =>
          `<option value="${t.key}" ${entry.capMode===t.key?'selected':''}>${t.label}</option>`
        ).join('');
        capSel.addEventListener('change', e=>{ entry.capMode = e.target.value; renderAll(); });
        el.querySelector('.re-sub').appendChild(capSel);
      }
    }
    list.appendChild(el);
  });
}

/* ---------------- RENDER SUMMARY / VALIDATION ---------------- */
function renderSummary(){
  const cfg = currentGameSizeCfg();
  const target = parseInt(targetPointsInput.value,10) || cfg.max;
  const total = totalPoints();
  const groupsUsed = reservedGroupsCount();

  $('#pillPoints').innerHTML = `${fmt(total)} / ${fmt(target)}<b>${t('pill.pts')}</b>`;
  $('#pillPoints').className = 'stat-pill ' + (total>target ? 'warn' : (total>0?'ok':''));
  $('#pillGroups').innerHTML = `${groupsUsed} / ${cfg.groups}<b>${t('pill.groups')}</b>`;
  $('#pillGroups').className = 'stat-pill ' + (groupsUsed>cfg.groups ? 'warn' : (groupsUsed>0?'ok':''));

  const warnings = computeWarnings(target, cfg, total, groupsUsed);
  const badCount = warnings.filter(w=>w.type==='bad').length;
  $('#pillStatus').innerHTML = (badCount===0 && roster.length>0) ? `${t('status.legal')}<b>${t('pill.status')}</b>` : (roster.length===0 ? `${t('status.empty')}<b>${t('pill.status')}</b>` : `${t('status.errors',{n:badCount, s:badCount>1?'S':''})}<b>${t('pill.status')}</b>`);
  $('#pillStatus').className = 'stat-pill ' + (roster.length===0 ? '' : (badCount===0?'ok':'warn'));

  $('#summaryGrid').innerHTML = `
    <div class="stat-pill">${fmt(total)}<b>${t('summary.totalPts')}</b></div>
    <div class="stat-pill">${roster.length}<b>${t('summary.entries')}</b></div>
    <div class="stat-pill">${groupsUsed}<b>${t('summary.groups')}</b></div>
    <div class="stat-pill">${fmt(Math.floor(target/4))}<b>${t('summary.maxPerGroup')}</b></div>
  `;

  const catMap = categoryPointsMap();
  const standardPts = catMap.Standard;
  $('#catBreakdown').innerHTML = ['Standard','Vanguard','Heavy','Support','Transport'].map(cat=>{
    const val = catMap[cat];
    const overCap = (cat!=='Standard' && cat!=='Transport' && val>standardPts);
    return `<div class="${overCap?'over':''}"><span>${cat}</span><span>${fmt(val)} pts${overCap?t('catBreakdown.overCap'):''}</span></div>`;
  }).join('');

  $('#warnBox').innerHTML = warnings.map(w=>`<div class="warn-item ${w.type}">${w.type==='bad'?'⚠':'✓'} ${w.msg}</div>`).join('');

  const statusBadge = $('#statusBadge');
  if(roster.length===0){ statusBadge.textContent=''; statusBadge.className='sec-badge'; }
  else if(badCount>0){ statusBadge.textContent = `⚠ ${badCount}`; statusBadge.className='sec-badge warn'; }
  else { statusBadge.textContent='✓'; statusBadge.className='sec-badge ok'; }

  const unitsBadge = $('#unitsBadge');
  unitsBadge.textContent = roster.length ? `${roster.length}` : '';
  unitsBadge.className = 'sec-badge';
}

function computeWarnings(target, cfg, total, groupsUsed){
  const warnings = [];
  if(total>target) warnings.push({type:'bad', msg:t('warn.pointsOver',{over:fmt(total-target), target:fmt(target)})});
  if(groupsUsed>cfg.groups) warnings.push({type:'bad', msg:t('warn.tooManyGroups',{used:groupsUsed, max:cfg.groups, size:gameSizeSelect.value})});

  const catMap = categoryPointsMap();
  ['Vanguard','Heavy','Support'].forEach(cat=>{
    if(catMap[cat] > catMap.Standard) warnings.push({type:'bad', msg:t('warn.catOverStandard',{cat:cat, catPts:fmt(catMap[cat]), stdPts:fmt(catMap.Standard)})});
  });
  if(catMap.Standard===0 && roster.length>0) warnings.push({type:'bad', msg:t('warn.noStandard')});

  const gmap = groupPointsMap();
  const stdCap = target/4;
  Object.entries(gmap).forEach(([gid,pts])=>{
    const entries = roster.filter(r=>r.groupId===gid || r.groupId===parseInt(gid,10));
    // Shaltari special rule (official Stat Cards): "Two or more non-Gate, non-Aircraft
    // Squads within a Shaltari Army may form Groups if their combined points cost does
    // not exceed 250pts." This is an alternative allowance, capped at min(target/4, 250)
    // rather than the standard target/4 alone, and only when 2+ distinct such Squads share the Group.
    const distinctShaltariNonGateNonAircraft = entries.every(e=>{
      const u = UNITS.find(uu=>uu.id===e.unitId);
      return u && u.faction==='Shaltari' && !isShaltariGate(u) && !u.type.startsWith('Aircraft');
    }) && entries.length>=2;
    const cap = distinctShaltariNonGateNonAircraft ? Math.min(stdCap, 250) : stdCap;
    if(pts>cap) warnings.push({type:'bad', msg:t('warn.groupOverCap',{gid:gid, pts:fmt(pts), cap:fmt(Math.floor(cap))})});

    // Shaltari special rule: only non-Gate, non-Aircraft Squads may be merged into a shared,
    // transport-less multi-Squad Group. A group containing an Aux Gate (a real Auxiliary
    // Transport carrying its own cargo Squad, per rule 3.2.4.3) is a different, legitimate
    // case and is not affected by this restriction.
    const hasAuxGateOrGate = entries.some(e=>{
      const u = UNITS.find(uu=>uu.id===e.unitId);
      return u && (isShaltariGate(u) || (u.special||'').includes('Aux Gate'));
    });
    const isMultiSquad = entries.length>=2;
    const allShaltari = entries.length>0 && entries.every(e=>{ const u = UNITS.find(uu=>uu.id===e.unitId); return u && u.faction==='Shaltari'; });
    const hasAircraft = entries.some(e=>{ const u = UNITS.find(uu=>uu.id===e.unitId); return u && u.type.startsWith('Aircraft'); });
    if(allShaltari && isMultiSquad && !hasAuxGateOrGate && hasAircraft){
      warnings.push({type:'bad', msg:t('warn.shaltariAircraftMultiGroup',{gid:gid})});
    }
  });

  const rareCounts = {}; const uniqueCounts = {};
  roster.forEach(r=>{ const u = UNITS.find(uu=>uu.id===r.unitId); if(u.rare) rareCounts[u.name]=(rareCounts[u.name]||0)+1; if(u.unique) uniqueCounts[u.name]=(uniqueCounts[u.name]||0)+1; });
  Object.entries(rareCounts).forEach(([name,count])=>{ if(count>cfg.rareMax) warnings.push({type:'bad', msg:t('warn.rareOver',{name:name, count:count, max:cfg.rareMax, size:gameSizeSelect.value})}); });
  Object.entries(uniqueCounts).forEach(([name,count])=>{ if(count>1) warnings.push({type:'bad', msg:t('warn.uniqueOver',{name:name, count:count})}); });

  roster.forEach(r=>{
    const u = UNITS.find(uu=>uu.id===r.unitId);
    if(u.squadMin!==null && (r.squadSize<u.squadMin || r.squadSize>u.squadMax)) warnings.push({type:'bad', msg:t('warn.squadSizeOut',{name:u.name, size:r.squadSize, min:u.squadMin, max:u.squadMax})});
    if(u.isBehemoth && r.squadSize!==1) warnings.push({type:'bad', msg:t('warn.behemothSquadSize',{name:u.name})});
  });

  if(warnings.length===0 && roster.length>0) warnings.push({type:'good', msg:t('warn.allGood')});

  // transport capacity per group, séparé Infanterie / Véhicule (only flags groups where TRANSPORT_DATA a été rempli)
  const tmap = transportLoadMap();
  Object.entries(tmap).forEach(([gid,load])=>{
    if(load.reqInf>load.capInf) warnings.push({type:'bad', msg:t('warn.transportInf',{gid:gid, req:load.reqInf, cap:load.capInf})});
	if(load.reqVeh>load.capVeh) warnings.push({type:'bad', msg:t('warn.transportVeh',{gid:gid, req:load.reqVeh, cap:load.capVeh})});
    if(load.reqVehLourd>load.capVehLourd) warnings.push({type:'bad', msg:t('warn.transportVehLourd',{gid:gid, req:load.reqVehLourd, cap:load.capVehLourd})});
    if(load.reqVehLeg>load.capVehLeg) warnings.push({type:'bad', msg:t('warn.transportVehLeg',{gid:gid, req:load.reqVehLeg, cap:load.capVehLeg})});
    if(load.reqSpe>load.capSpe) warnings.push({type:'bad', msg:t('warn.transportSpe',{gid:gid, req:load.reqSpe, cap:load.capSpe})});
    if(load.reqSpe2>load.capSpe2) warnings.push({type:'bad', msg:t('warn.transportSpe2',{gid:gid, req:load.reqSpe2, cap:load.capSpe2})});

  });

  // Règle de composition de Groupe (toutes factions) : un Groupe légal est soit
  // "Une Escouade dans plusieurs Transports", soit "Plusieurs Escouades dans un Transport",
  // mais jamais "Plusieurs Escouades dans plusieurs Transports".
  Object.keys(gmap).forEach(gid=>{
    const entries = roster.filter(r=>r.groupId===gid || r.groupId===parseInt(gid,10));
    // Les Gates Shaltari sont exclues : elles n'embarquent jamais de cargo au moment de la
    // construction de liste (voir l'exception isShaltariGate plus haut) et ne participent
    // donc pas à cet appariement Escouade/Transport classique.
    const relevant = entries.filter(e=>{
      const u = UNITS.find(uu=>uu.id===e.unitId);
      return u && !isShaltariGate(u);
    });
    const nTransports = relevant.filter(e=>{
      const td = TRANSPORT_DATA[e.unitId];
      return td && (td.capInf>0 || td.capVehLourd>0 || td.capVeh>0 || td.capVehLeg>0 || td.capSpe>0 || td.capSpe2>0);
    }).length;
    const nSquads = relevant.length - nTransports;
    if(nTransports>=2 && nSquads>=2){
      warnings.push({type:'bad', msg:t('warn.manySquadsManyTransports',{gid:gid})});
    }
  });

  return warnings;

}

/* ---------------- CSV EXPORT ---------------- */
function exportCsv(){
	const rows = [t('csv.headers').split(',')];
	roster.forEach(entry=>{
    const u = UNITS.find(uu=>uu.id===entry.unitId);
    const v = u.variants[entry.variantIdx];
	const filteredSpecial = filterSpecialByVariant(u.special, v.name);
    const td = TRANSPORT_DATA[entry.unitId] || {reqInf:0,reqVeh:0,capInf:0,capVeh:0};
    const baseRow = [
      u.faction, u.category, u.isBehemoth?t('csv.oui'):t('csv.non'), u.name, v.name, entry.squadSize, v.pts, unitTotalPts(entry), entry.groupId,
      u.rare?t('csv.oui'):t('csv.non'), u.unique?t('csv.oui'):t('csv.non'), u.type, u.mv, u.stats, u.special, (u.gear||[]).join(' | '),
      td.reqInf, td.capInf, td.reqVeh, td.capVeh
    ];
    const emptyRow = baseRow.map(()=>'');

    const filteredWeapons = u.weapons.filter(w => !isOptionalWeapon(w) && weaponMatchesVariant(w.n, v.name));
    const extraWeapons = (entry.extras||[]).map(name=>u.weapons.find(w=>w.n===name)).filter(Boolean);
    const allWeapons = [...filteredWeapons, ...extraWeapons];
    if(allWeapons.length===0){
      rows.push([...baseRow, '-', '-', '-', '-', '-', '-', '-', '-', '-']);
    } else {
      allWeapons.forEach((w,i)=>{
        const rowPrefix = i===0 ? baseRow : emptyRow;
        rows.push([...rowPrefix, (i+1), w.n, w.arc, w.ma, w.r, w.att, w.ac, w.e, w.sp]);
      });
    }
  });
  rows.push([]);
  rows.push([t('csv.totalPoints'), totalPoints()]);
  rows.push([t('csv.groupsUsed'), reservedGroupsCount()]);
  rows.push([t('csv.gameSize'), gameSizeSelect.value]);
  rows.push([t('csv.targetPoints'), targetPointsInput.value]);
  rows.push([]);
  rows.push([t('csv.transportSectionTitle')]);
  rows.push(t('csv.transportHeaders').split(','));
  const tmap = transportLoadMap();
  Object.entries(tmap).forEach(([gid,load])=>{
    const ok = load.reqInf<=load.capInf && load.reqVeh<=load.capVeh;
    rows.push([gid, load.reqInf, load.capInf, load.reqVeh, load.capVeh, ok?t('csv.ok'):t('csv.overCapacity')]);
  });
  rows.push([]);
  rows.push([t('csv.glossarySectionTitle')]);
  rows.push(t('csv.glossaryHeaders').split(','));
  currentGlossary().forEach(([k,v])=>rows.push([k,v]));

  const csv = rows.map(r=>r.map(c=>{
    const s = String(c ?? '');
    return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(';')).join('\n');

  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `dzc-roster-${factionSelect.value}-${gameSizeSelect.value}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

      return `<div class="gb-member${isTransport?' transport':''}">${u.name} ×${e.squadSize}${tag}</div>`;
    }).join('');
    const loadHtml = (load.capInf||load.reqInf||load.capVehLourd||load.reqVehLourd||load.capVeh||load.reqVeh||load.capVehLeg||load.reqVehLeg||load.capSpe||load.reqSpe||load.capSpe2||load.reqSpe2) ? `
      <div class="gb-load">
        <span class="${overInf ? 'over' : (equalInf ? 'equal' : '')}">${t('group.load.inf',{req:load.reqInf, cap:load.capInf})}</span>
        <span class="${overVehLourd ? 'over' : (equalVehLourd ? 'equal' : '')}">${t('group.load.vehLourd',{req:load.reqVehLourd, cap:load.capVehLourd})}</span>
		<span class="${overVeh ? 'over' : (equalVeh ? 'equal' : '')}">${t('group.load.veh',{req:load.reqVeh, cap:load.capVeh})}</span>
		<span class="${overVehLeg ? 'over' : (equalVehLeg ? 'equal' : '')}">${t('group.load.vehLeg',{req:load.reqVehLeg, cap:load.capVehLeg})}</span>
		<span class="${overSpe ? 'over' : (equalSpe ? 'equal' : '')}">${t('group.load.spe',{req:load.reqSpe, cap:load.capSpe})}</span>
		<span class="${overSpe2 ? 'over' : (equalSpe2 ? 'equal' : '')}">${t('group.load.spe2',{req:load.reqSpe2, cap:load.capSpe2})}</span>
      </div>` : '';
    return `<div class="group-block ${status}"><h4>${t('group.label',{gid:gid})}</h4>${members}${loadHtml}</div>`;

  if(anyOver){ transportBadge.textContent='⚠'; transportBadge.className='sec-badge warn'; }
  else { transportBadge.textContent='✓'; transportBadge.className='sec-badge ok'; }
}

function usedGlossaryTerms(){
  const bits = [];
  roster.forEach(entry=>{
    const u = UNITS.find(uu=>uu.id===entry.unitId);
    const v = u.variants[entry.variantIdx];
	const filteredSpecial = filterSpecialByVariant(u.special, v.name);
    bits.push(filteredSpecial);
    (u.gear||[]).forEach(g=>bits.push(g));
    const filteredWeapons = u.weapons.filter(w => !isOptionalWeapon(w) && weaponMatchesVariant(w.n, v.name));
    const extraWeapons = (entry.extras||[]).map(name=>u.weapons.find(w=>w.n===name)).filter(Boolean);
    [...filteredWeapons, ...extraWeapons].forEach(w=>bits.push(w.sp));
  });
  const blob = bits.join(' ; ').toLowerCase();
  return currentGlossary().filter(([term])=>{
    const key = term.split('(')[0].replace(/[X0-9+":]/g,'').trim().split(' ')[0].toLowerCase();
    return key.length>=2 && blob.includes(key);
  });
}

// Fonction de nettoyage unifiée (sans gestion des parenthèses optionnelles)
// Elle supprime les chiffres et la ponctuation, mais conserve les tirets (-)
function cleanTermForMatching(text) {
  if (!text) return '';
  return text
    .replace(/[0-9+":.]/g, '') // Enlève les chiffres et la ponctuation parasite (le tiret \- est préservé !)
    .trim()
    .split(/\s+/)[0]           // Récupère uniquement le premier mot s'il y a un espace
    .toLowerCase();
}

function explainSpecialString(spStr){
  if(!spStr || spStr==='-') return '';
  const parts = spStr.split(',').map(s=>s.trim()).filter(Boolean);
  const explained = parts.map(part=>{
    
    const keyGuess = cleanTermForMatching(part);
    
    const match = currentGlossary().find(([term]) => {
      return cleanTermForMatching(term) === keyGuess;
    });
    
    return match ? `<b>${part}</b> : ${match[1]}` : `<b>${part}</b>`;
  });
  return explained.join('<br>');
}

function extractGlossaryMatches(str){
  if(!str || str==='-' || str==='—') return [];
  return str.split(',').map(s=>s.trim()).filter(Boolean).map(part=>{
    
    const keyGuess = cleanTermForMatching(part);
    
    const match = currentGlossary().find(([term]) => {
      return cleanTermForMatching(term) === keyGuess;
    });
    
    return match ? {term: match[0], def: match[1]} : null;
  }).filter(Boolean);
}

            onchange="var on=this.checked; document.querySelectorAll('.pdf-group-glossary').forEach(function(el){ if(!el.closest('.pdf-final-glossary')) el.style.display = on ? 'none' : ''; }); var fg=document.querySelector('.pdf-final-glossary'); if(fg) fg.style.display = on ? '' : 'none';">
          ${t('pdf.consolidateGlossaryToggle')}
        </label>
      </div>
      <h1>${t('pdf.h1',{faction:factionSelect.value})}</h1>
      <div class="meta">${t('pdf.meta',{size:gameSizeSelect.value, total:fmt(total), target:fmt(target), groups:reservedGroupsCount(), maxGroups:cfg.groups})}</div>
      ${groupBlocksHtml}
      ${finalGlossaryHtml}
    </body></html>
  `);
  win.document.close();
}

/* ---------------- JSON EXPORT / IMPORT (sauvegarde de la liste) ---------------- */
function exportRosterJson(){
  const data = {
    version: 'dzc-roster-v1',
    faction: factionSelect.value,
    gameSize: gameSizeSelect.value,
    targetPoints: targetPointsInput.value,
    nextRid, nextGroup,
    roster
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `dzc-roster-${factionSelect.value}-${gameSizeSelect.value}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importRosterJson(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if(data.version !== 'dzc-roster-v1') { alert(t('alert.badJsonVersion')); return; }
      // vérifie que chaque unité importée existe toujours dans le catalogue actuel
      const validRoster = (data.roster||[]).filter(r => UNITS.some(u=>u.id===r.unitId));
      if(validRoster.length !== (data.roster||[]).length){
        alert(t('alert.someUnitsIgnored'));
      }
      factionSelect.value = data.faction || factionSelect.value;
      gameSizeSelect.value = data.gameSize || gameSizeSelect.value;
      targetPointsInput.value = data.targetPoints || targetPointsInput.value;
      roster = validRoster;
      nextRid = data.nextRid || (Math.max(0, ...roster.map(r=>r.rid)) + 1);
      nextGroup = data.nextGroup || (Math.max(0, ...roster.map(r=>r.groupId)) + 1);
      renderAll();
    } catch(err){
      alert(t('alert.jsonReadError',{err:err.message}));
    }
  };
  reader.readAsText(file);
}


/* ---------------- WIRE UP ---------------- */
function renderAll(){ renderCatalog(); renderRoster(); renderGroupSummary(); renderSummary(); }

factionSelect.addEventListener('change', ()=>{
  if(roster.length>0 && !confirm(t('confirm.changeFaction'))){
    factionSelect.value = roster[0] ? UNITS.find(u=>u.id===roster[0].unitId).faction : factionSelect.value;
    return;
  }
  roster = []; nextGroup=1; renderAll();
});
gameSizeSelect.addEventListener('change', ()=>{
  const cfg = currentGameSizeCfg();
  targetPointsInput.value = cfg===GAME_SIZES.Reconquest ? 3500 : Math.round((cfg.min+cfg.max)/2/5)*5;
  renderAll();
});
targetPointsInput.addEventListener('input', renderSummary);
searchBox.addEventListener('input', renderCatalog);
catFilter.addEventListener('change', renderCatalog);
$('#exportCsv').addEventListener('click', exportCsv);
$('#exportPdf').addEventListener('click', exportPdf);
$('#resetBtn').addEventListener('click', ()=>{ if(roster.length===0 || confirm(t('confirm.resetRoster'))){ roster=[]; nextGroup=1; renderAll(); } });
$('#exportJson').addEventListener('click', exportRosterJson);
$('#importJsonBtn').addEventListener('click', ()=> $('#importJsonFile').click());
$('#importJsonFile').addEventListener('change', (e)=>{
  if(e.target.files[0]) importRosterJson(e.target.files[0]);
  e.target.value = ''; // permet de réimporter le même fichier plusieurs fois
});
$('#langToggle').addEventListener('click', ()=>{
  LANG = (LANG==='fr') ? 'en' : 'fr';
  try { localStorage.setItem('dzcLang', LANG); } catch(e){}
  applyStaticI18n();
  renderGlossary();
  renderAll();
});

document.querySelectorAll('.collapse-toggle').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const body = document.getElementById(btn.dataset.target);
    const nowHidden = body.classList.toggle('hidden');
    btn.querySelector('.chev').textContent = nowHidden ? '▸' : '▾';
    btn.setAttribute('aria-expanded', String(!nowHidden));
  });
});

applyStaticI18n();
renderGlossary();
renderAll();
</script>
</body>
